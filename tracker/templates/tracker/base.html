<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Amar Hishab{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e13;--panel:#131821;--panel2:#181e28;--border:#252c38;--text:#edf1f7;--muted:#8993a2;--accent:#6d5dfc;--green:#35d39a;--red:#ff6b78;--yellow:#f6c85f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Noto Sans Bengali,system-ui,sans-serif}a{color:inherit}
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:7px;padding:12px 22px;background:#10141bcc;backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-wrap:wrap}.brand{font-weight:800;margin-right:12px}.brand span{color:#a79eff}
nav a{padding:8px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13px}nav a:hover,nav a.active{background:var(--panel2);color:var(--text)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}.user{font-size:12px;color:var(--muted)}.lang{display:flex;padding:3px;background:var(--panel2);border:1px solid var(--border);border-radius:9px}.lang button{border:0;background:transparent;color:var(--muted);padding:6px 9px;border-radius:6px;cursor:pointer;font-weight:800}.lang button.active{background:var(--accent);color:white}
.container{max-width:1220px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.muted{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{color:var(--red)}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}.label{font-size:12px;color:var(--muted)}.value{font-size:26px;font-weight:800;margin-top:5px}.income{color:var(--green)}.expense{color:var(--red)}.balance{color:#b7adff}
.section{margin:27px 0 10px;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.account-card{position:relative;overflow:hidden}.account-card:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:#6d5dfc12}.account-name{font-weight:750}.account-type{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--border)}th{font-size:11px;color:var(--muted);text-transform:uppercase}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:7px;font-size:11px;font-weight:800}.badge.income{background:#35d39a18}.badge.expense{background:#ff6b7818}
form.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}input,select,textarea{width:100%;background:#0e131b;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}.filter input,.filter select{width:auto}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}.form-card{max-width:620px}.help{font-size:11px;color:var(--muted);margin-top:5px}
.alert{padding:11px 14px;border-radius:10px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);font-size:13px}.alert.success{border-color:#35d39a55}.alert.error{border-color:#ff6b7855}
@media(max-width:700px){nav{padding:10px 14px}.nav-right{margin-left:0}.container{padding:16px}.top{align-items:start;flex-direction:column}.top h1{font-size:23px}.two{grid-template-columns:1fr}}
</style>
</head><body>
<nav>
<a class="brand" href="{% url 'tracker:dashboard' %}">💰 <span data-i18n="brand">Amar Hishab</span></a>
<a href="{% url 'tracker:dashboard' %}" data-i18n="dashboard">Dashboard</a>
<a href="{% url 'tracker:transactions' %}" data-i18n="transactions">Transactions</a>
<a href="{% url 'tracker:yearly_overview' %}" data-i18n="yearly">Yearly</a>
<a href="{% url 'tracker:add_transaction' %}" data-i18n="add">+ Add</a>
<a href="{% url 'tracker:transfer_money' %}" data-i18n="transfer">Transfer</a>
<div class="nav-right"><span class="user">{{ request.user.email|default:request.user.username }}</span><form method="post" action="/accounts/logout/" style="margin:0">{% csrf_token %}<button class="btn" type="submit" data-i18n="logout">Logout</button></form>
<div class="lang"><button data-language="en">EN</button><button data-language="bn">BN</button></div></div>
</nav>
<div class="container">
{% if messages %}{% for message in messages %}<div class="alert {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</div>
<script>
const I18N={en:{brand:'Amar Hishab',dashboard:'Dashboard',transactions:'Transactions',yearly:'Yearly',add:'+ Add',transfer:'Transfer',logout:'Logout',greeting:'Good to see you',income:'Income',expense:'Expense',total_balance:'Total Balance',monthly_income:'Monthly Income',monthly_expense:'Monthly Expense',saved:'Saved This Month',accounts:'Your Accounts',recent:'Recent Transactions',category:'Category',method:'Account / Method',amount:'Amount',date:'Date',description:'Description',no_data:'No transactions yet',view_all:'View all',month_summary:'Monthly Summary',expense_category:'Expense by Category',expense_method:'Expense by Payment Method',income_source:'Income Sources',received_via:'Received via',yearly_summary:'Yearly Summary',show:'Show',transfer_title:'Move Money Between Accounts',from:'From',to:'To',save_transfer:'Save Transfer',transfer_note:'Transfers are not income or expense. The exact amount is moved between accounts.',add_title:'Add Transaction',transaction_type:'Transaction Type',income_source_label:'Income Source',expense_category_label:'Expense Category',received_method:'Received via',payment_method:'Payment Method',save:'Save Transaction',description_optional:'Description (optional)',no_hidden_fee:'The amount you enter is recorded exactly. No automatic fee or 0.03 is deducted.',other_source:'Where did it come from?',search:'Search',all:'All',export:'Export CSV',delete:'Delete'},bn:{brand:'আমার হিসাব',dashboard:'ড্যাশবোর্ড',transactions:'লেনদেন',yearly:'বার্ষিক',add:'+ যোগ করুন',transfer:'টাকা ট্রান্সফার',logout:'লগআউট',greeting:'আবারও স্বাগতম',income:'আয়',expense:'খরচ',total_balance:'মোট ব্যালেন্স',monthly_income:'মাসের আয়',monthly_expense:'মাসের খরচ',saved:'এই মাসে সঞ্চয়',accounts:'আপনার অ্যাকাউন্ট',recent:'সাম্প্রতিক লেনদেন',category:'খাত',method:'অ্যাকাউন্ট / মাধ্যম',amount:'পরিমাণ',date:'তারিখ',description:'বিবরণ',no_data:'এখনও কোনো লেনদেন নেই',view_all:'সব দেখুন',month_summary:'মাসিক সারসংক্ষেপ',expense_category:'খাত অনুযায়ী খরচ',expense_method:'পেমেন্ট মাধ্যম অনুযায়ী খরচ',income_source:'আয়ের উৎস',received_via:'যেভাবে পেয়েছেন',yearly_summary:'বার্ষিক সারসংক্ষেপ',show:'দেখুন',transfer_title:'এক অ্যাকাউন্ট থেকে অন্যটিতে টাকা দিন',from:'যে অ্যাকাউন্ট থেকে',to:'যে অ্যাকাউন্টে',save_transfer:'ট্রান্সফার সংরক্ষণ করুন',transfer_note:'ট্রান্সফার আয় বা খরচ হিসেবে ধরা হবে না। সঠিক পরিমাণ এক অ্যাকাউন্ট থেকে অন্যটিতে যাবে।',add_title:'লেনদেন যোগ করুন',transaction_type:'লেনদেনের ধরন',income_source_label:'আয়ের উৎস',expense_category_label:'খরচের খাত',received_method:'যেভাবে পেয়েছেন',payment_method:'পেমেন্ট মাধ্যম',save:'লেনদেন সংরক্ষণ করুন',description_optional:'বিবরণ (ঐচ্ছিক)',no_hidden_fee:'আপনি যত টাকা লিখবেন ঠিক তত টাকাই সংরক্ষণ হবে। কোনো অটোমেটিক ফি বা ০.০৩ টাকা কাটা হবে না।',other_source:'কোথা থেকে এসেছে?',search:'খুঁজুন',all:'সব',export:'CSV এক্সপোর্ট',delete:'ডিলিট'}};
const MONTHS={en:['','January','February','March','April','May','June','July','August','September','October','November','December'],bn:['','জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর']};
function applyLanguage(lang){lang=lang==='bn'?'bn':'en';localStorage.setItem('financeTrackerLanguage',lang);document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{let k=e.dataset.i18n;if(I18N[lang][k]!==undefined)e.textContent=I18N[lang][k]});document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>{let k=e.dataset.i18nPlaceholder;if(I18N[lang][k]!==undefined)e.placeholder=I18N[lang][k]});document.querySelectorAll('[data-month]').forEach(e=>e.textContent=MONTHS[lang][e.dataset.month]||e.textContent);document.querySelectorAll('[data-category-en]').forEach(e=>e.textContent=lang==='bn'?(e.dataset.categoryBn||e.dataset.categoryEn):e.dataset.categoryEn);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.language===lang));if(window.refreshChartsLanguage)window.refreshChartsLanguage(lang)}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>applyLanguage(b.dataset.language));applyLanguage(localStorage.getItem('financeTrackerLanguage')||'en')});
</script>{% block extra_js %}{% endblock %}</body></html>
