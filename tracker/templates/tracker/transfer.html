{% extends "tracker/base.html" %}{% block title %}Transfer Money{% endblock %}{% block content %}<div class="top"><div><h1 data-i18n="transfer_title">Move Money Between Accounts</h1><div class="muted" data-i18n="transfer_note">Transfers are not income or expense. The exact amount is moved between accounts.</div></div></div><div class="card form-card"><form method="post">{% csrf_token %}
<div class="field"><label data-i18n="from">From</label><select name="from_method" required>{% for pm in payment_methods %}<option value="{{pm.id}}">{{pm.name}} — ৳ {{pm.current_balance|floatformat:2}}</option>{% endfor %}</select></div>
<div class="field"><label data-i18n="to">To</label><select name="to_method" required>{% for pm in payment_methods %}<option value="{{pm.id}}">{{pm.name}}</option>{% endfor %}</select></div>
<div class="field"><label data-i18n="amount">Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div>
<div class="field"><label data-i18n="date">Date</label><input name="date" type="date" value="{% now 'Y-m-d' %}" required></div>
<div class="field"><label data-i18n="description">Description</label><textarea name="note"></textarea></div><button class="btn primary" style="width:100%" data-i18n="save_transfer">Save Transfer</button></form></div>{% endblock %}
